<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kingdom Gate — Dungeon Knights</title>
    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="shared-wallet.css">
    <style>
        /* Landing page specific overrides */
        .landing-wrapper {
            flex: 1;
            display: flex;
            flex-direction: row;
            overflow: hidden;
            position: relative;
        }

        .landing-wrapper video,
        .landing-wrapper .video-overlay {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .landing-wrapper video {
            object-fit: cover;
            z-index: 0;
        }

        .landing-wrapper .video-overlay {
            background: rgba(0, 0, 0, 0.55);
            z-index: 1;
        }

        .landing-wrapper .side-panel,
        .landing-wrapper main {
            position: relative;
            z-index: 2;
        }

        .landing-wrapper .side-panel {
            width: 340px;
            flex-shrink: 0;
            align-self: stretch;
        }

        .landing-wrapper main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
            align-self: stretch;
        }
    </style>
</head>
<body>
<div class="page">

    <!-- Background -->
    <div class="page-bg" style="background-image:url('assets/ui/menu-background.jpg')"></div>

    <!-- Header -->
    <header class="header">
        <div class="header-brand">
            <span class="header-title">DUNGEON KNIGHTS</span>
        </div>
        <div class="header-actions">
            <div class="wallet-pill" id="walletWidget">
                <span id="dngBalanceHeader">0 DNG</span>
            </div>
        </div>
    </header>

    <!-- Two-panel layout -->
    <div class="landing-wrapper">

        <!-- Intro Video Background (full bleed, no borders) -->
        <video autoplay loop muted playsinline>
            <source src="assets/intro.mp4" type="video/mp4">
        </video>

        <!-- Dark overlay for readability -->
        <div class="video-overlay"></div>

        <!-- LEFT: Adventure Panel -->
        <aside class="side-panel">
            <div class="side-panel-header">
                <img src="assets/ui/sword.png" class="panel-header-icon" alt="">
                Adventure
            </div>
            <div class="side-panel-body" style="display:flex;flex-direction:column;gap:10px;flex:1;overflow-y:auto">

                <button class="card card-accent-left" id="enterDungeonBtn" style="display:flex;align-items:center;gap:14px;padding:16px 18px;text-align:left">
                    <img src="assets/ui/sword.png" style="width:32px;height:32px;image-rendering:pixelated;filter:brightness(1.3) sepia(0.5) hue-rotate(5deg);flex-shrink:0" alt="">
                    <div style="flex:1">
                        <div style="font-family:var(--font-heading);font-size:14px;font-weight:700;color:var(--accent-gold);letter-spacing:1px;text-transform:uppercase">Enter Dungeon</div>
                        <div style="font-size:11px;color:var(--text-muted);margin-top:2px">Deploy selected knights</div>
                    </div>
                    <span style="color:var(--accent-gold-dim);font-size:18px;font-weight:700">&#10230;</span>
                </button>

                <button class="card card-accent-left" id="summonKnightBtn" style="display:flex;align-items:center;gap:14px;padding:16px 18px;text-align:left;border-left-color:var(--tint-mines)">
                    <img src="assets/ui/shield.png" style="width:32px;height:32px;image-rendering:pixelated;filter:brightness(1.3);flex-shrink:0" alt="">
                    <div style="flex:1">
                        <div style="font-family:var(--font-heading);font-size:14px;font-weight:700;color:var(--text-primary);letter-spacing:1px;text-transform:uppercase">Summon Knight</div>
                        <div style="font-size:11px;color:var(--text-muted);margin-top:2px">Forge a new hero</div>
                    </div>
                    <span style="color:var(--text-muted);font-size:18px;font-weight:700">&#10230;</span>
                </button>

                <button class="card" id="leaderboardLandingBtn" style="display:flex;align-items:center;gap:14px;padding:16px 18px;text-align:left">
                    <img src="assets/ui/castle.png" style="width:32px;height:32px;image-rendering:pixelated;filter:brightness(1.3);flex-shrink:0" alt="">
                    <div style="flex:1">
                        <div style="font-family:var(--font-heading);font-size:14px;font-weight:700;color:var(--text-primary);letter-spacing:1px;text-transform:uppercase">Hall of Fame</div>
                        <div style="font-size:11px;color:var(--text-muted);margin-top:2px">View legendary warriors</div>
                    </div>
                    <span style="color:var(--text-muted);font-size:18px;font-weight:700">&#10230;</span>
                </button>

                <button class="card" id="marketplaceBtn" disabled style="display:flex;align-items:center;gap:14px;padding:16px 18px;text-align:left;opacity:0.35;cursor:not-allowed">
                    <div style="width:32px;height:32px;display:flex;align-items:center;justify-content:center;flex-shrink:0;border:2px solid var(--border-base);border-radius:4px">
                        <div style="width:10px;height:10px;border:2px solid var(--text-muted);border-radius:2px"></div>
                    </div>
                    <div style="flex:1">
                        <div style="font-family:var(--font-heading);font-size:14px;font-weight:700;color:var(--text-secondary);letter-spacing:1px;text-transform:uppercase">Marketplace</div>
                        <div style="font-size:11px;color:var(--text-muted);margin-top:2px">Coming soon</div>
                    </div>
                    <span class="badge badge-stone">SOON</span>
                </button>

                <div style="border-top:1px solid var(--border-base);margin:8px 0"></div>

                <div style="padding:12px 16px;text-align:center">
                    <p style="font-family:var(--font-heading);font-size:11px;color:var(--text-muted);letter-spacing:1px">
                        ROBINHOOD CHAIN TESTNET
                    </p>
                </div>
            </div>
        </aside>

        <!-- RIGHT: Content Area -->
        <main>
            <!-- Title -->
            <div style="text-align:center;margin-bottom:40px;position:relative;z-index:2">
                <h1 style="font-family:var(--font-display);font-size:3rem;color:var(--accent-gold);letter-spacing:4px;text-transform:uppercase;text-shadow:2px 2px 0 rgba(0,0,0,0.8),0 0 40px rgba(212,175,55,0.2)">
                    Kingdom Gate
                </h1>
                <p style="font-family:var(--font-heading);color:var(--text-secondary);letter-spacing:2px;margin-top:10px;font-size:14px">
                    ~ Embark on Your Quest ~
                </p>
            </div>

            <!-- Knight Preview -->
            <div style="text-align:center;max-width:500px;position:relative;z-index:2">
                <p style="color:var(--text-muted);font-size:13px;line-height:1.8;margin-bottom:30px">
                    Recruit brave knights and send them into dangerous dungeons.
                    Claim $DNG rewards for every successful run.
                </p>

                <div style="display:flex;gap:16px;justify-content:center;flex-wrap:wrap">
                    <div style="text-align:center;padding:20px">
                        <div style="font-family:var(--font-display);font-size:28px;color:var(--accent-gold)">5</div>
                        <div style="font-size:11px;color:var(--text-muted);letter-spacing:1px;margin-top:4px">DUNGEONS</div>
                    </div>
                    <div style="width:1px;background:var(--border-base)"></div>
                    <div style="text-align:center;padding:20px">
                        <div style="font-family:var(--font-display);font-size:28px;color:var(--accent-gold)">6</div>
                        <div style="font-size:11px;color:var(--text-muted);letter-spacing:1px;margin-top:4px">RARITIES</div>
                    </div>
                    <div style="width:1px;background:var(--border-base)"></div>
                    <div style="text-align:center;padding:20px">
                        <div style="font-family:var(--font-display);font-size:28px;color:var(--accent-gold)">15</div>
                        <div style="font-size:11px;color:var(--text-muted);letter-spacing:1px;margin-top:4px">MAX SQUAD</div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="ethers-5.7.2.umd.min.js"></script>
    <script src="config.js"></script>
    <script src="wallet.js"></script>
    <script src="audio.js"></script>
    <script src="landing.js"></script>
</body>
</html>
