<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>video probe</title>
<style>
  html,body{margin:0;background:#111;color:#eee;font:13px monospace}
  #stage{display:block;margin:0 auto}
  #meta{padding:6px 10px;white-space:pre}
</style>
</head>
<body>
<div id="meta">loading…</div>
<video id="v" crossorigin="anonymous" muted playsinline></video>
<canvas id="stage"></canvas>
<script>
const FILES = [
  'maps/main vid/Pixel_art_dungeon_map_animation_20260918044104_processed.mp4',
  'maps/main vid/Pixel_art_magma_dungeon_map_20260918044059_processed.mp4',
  'maps/main vid/goblin mine.mp4',
  'maps/main vid/overgrown temple.mp4',
  'maps/main vid/void rift.mp4',
];
const v = document.getElementById('v');
const c = document.getElementById('stage');
const ctx = c.getContext('2d');
v.style.display = 'none';

function load(i){
  return new Promise((res, rej) => {
    v.onloadedmetadata = () => res();
    v.onerror = () => rej(new Error('load fail ' + FILES[i]));
    v.src = '/' + FILES[i].split('/').map(encodeURIComponent).join('/');
  });
}
function seek(t){
  return new Promise(res => { v.onseeked = () => res(); v.currentTime = t; });
}
function paint(scale){
  scale = scale || 1;
  c.width = Math.round(v.videoWidth * scale);
  c.height = Math.round(v.videoHeight * scale);
  ctx.drawImage(v, 0, 0, c.width, c.height);
}

// exposed for the agent to drive via eval
window.probe = { FILES, v, c, ctx, load, seek, paint,
  async meta(){
    const out = [];
    for (let i = 0; i < FILES.length; i++){
      await load(i);
      out.push({ i, file: FILES[i].split('/').pop(),
                 w: v.videoWidth, h: v.videoHeight,
                 dur: +v.duration.toFixed(2) });
    }
    return out;
  },
  async show(i, t, scale){ await load(i); await seek(t); paint(scale); return {i, t}; }
};
document.getElementById('meta').textContent = 'ready';
</script>
</body>
</html>
